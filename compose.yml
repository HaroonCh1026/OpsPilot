services:
  postgres:
    image: postgres:16
    container_name: opspilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: opspilot
      POSTGRES_PASSWORD: ${OPSPILOT_DB_PASSWORD}
      POSTGRES_DB: opspilot_development
    ports:
      - "5432:5432"
    volumes:
      - opspilot_pgdata:/var/lib/postgresql/data

volumes:
  opspilot_pgdata:
    external: true